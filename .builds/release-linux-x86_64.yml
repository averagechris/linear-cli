image: nixos/unstable
arch: x86_64
environment:
  NIX_CONFIG: "experimental-features = nix-command flakes"
sources:
  - https://git.sr.ht/~averagechris/linear-cli
tasks:
  - build: |
      cd linear-cli
      nix build .#release-artifact --out-link result-release-artifact
      mkdir -p ~/artifacts
      cp -p result-release-artifact/* ~/artifacts/
artifacts:
  - artifacts/linear-cli-v1.2.9-x86_64-linux.tar.gz
  - artifacts/linear-cli-v1.2.9-x86_64-linux.tar.gz.sha256
