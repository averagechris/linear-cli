[package]
name = "linear-cli"
version = "1.6.4"
edition = "2021"
description = "A powerful CLI for Linear.app - manage issues, projects, cycles, and more from your terminal"
authors = ["Christopher Cummings"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Finesssee/linear-cli"
homepage = "https://github.com/Finesssee/linear-cli"
readme = "README.md"
keywords = ["linear", "cli", "project-management", "issues", "productivity"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "linear"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13.4", default-features = false, features = ["charset", "form", "http2", "json", "rustls", "stream", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "3"
tabled = { version = "0.21", default-features = false, features = ["std"] }
dirs = "6"
toml = "1"
anyhow = "1"
dialoguer = "0.12"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
rand = "0.10"
csv = "1"
gix = { version = "0.85", features = ["blocking-network-client", "blocking-http-transport-reqwest-native-tls"] }
sha2 = "0.11"
open = "5"
url = "2"
base64 = "0.22"
hmac = "0.13"
hex = "0.4"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = "4"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = "4"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = "4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = "s"
panic = "abort"
